<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasan Mia Personal App</title>
   <link rel="stylesheet" href="gallery-style.css">
    <link rel="manifest" href="manifest.json">
</head>
 ৷   <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("App Ready!"))
        .catch(error => console.log("Service Worker Error:", error));
    });
}
</script>
<body>
     <section class="clock-box">
    <h2 id="clock">00:00:00</h2>
    <p id="date"></p>
</section>

    <h1>আসসালামু আলাইকুম</h1>

    <h2>Welcome to Hasan Mia App</h2>

    <p>আমি হাসান। আমি ওয়েব ডিজাইন ও প্রোগ্রামিং শিখছি।</p>

    <div class="menu">
        <button onclick="showProfile()">👤 My Profile</button>

        <button onclick="showMessage('আমি HTML, CSS ও JavaScript শিখছি।')">📚 My Learning</button>

        <button onclick="showMessage('আমার ওয়েবসাইট শিগগিরই এখানে যুক্ত হবে।')">🌐 My Website</button>

        <button onclick="showNotes()">📝 My Notes</button>
       <button onclick="showPhotos()">🖼️ My Photos</button>
    </div>
</section>
<section id="notes" hidden>
    <h2>📝 আমার নোট</h2>

    <input type="text" id="noteTitle" placeholder="নোটের শিরোনাম">

    <textarea id="noteText" placeholder="এখানে নোট লেখো..."></textarea>

    <button onclick="saveNote()">💾 Save Note</button>

    <p id="savedMessage"></p>
    <div id="notesList"></div>
</section>       <section id="photos" hidden>
    <h2>আমার ছবি</h2>
    <img src="images/photo1.png" alt="আমার ছবি" class="my-photo">
</section>

<script>
function showMessage(message) {
    alert(message);
}

function showProfile() {
    alert("নাম: হাসান\nশিখছি: HTML, CSS ও JavaScript\nলক্ষ্য: ওয়েব ডেভেলপার হওয়া");
}

let notes = JSON.parse(localStorage.getItem("myNotes")) || [];
let editIndex = -1;

function showNotes() {
    document.getElementById("notes").hidden = false;
    displayNotes();
}

function saveNote() {
    const title = document.getElementById("noteTitle").value.trim();
    const text = document.getElementById("noteText").value.trim();

    if (!title || !text) {
        alert("শিরোনাম ও নোট লিখো!");
        return;
    }

    if (editIndex === -1) {
        notes.push({title, text});
    } else {
        notes[editIndex] = {title, text};
    }

    localStorage.setItem("myNotes", JSON.stringify(notes));

    document.getElementById("noteTitle").value = "";
    document.getElementById("noteText").value = "";
    editIndex = -1;

    document.getElementById("savedMessage").textContent = "নোট Save হয়েছে!";
    displayNotes();
}

function displayNotes() {
    const list = document.getElementById("notesList");
    list.innerHTML = "";

    notes.forEach((note, index) => {
        const item = document.createElement("div");
        const heading = document.createElement("h3");
        const content = document.createElement("p");
        const edit = document.createElement("button");
        const del = document.createElement("button");

        heading.textContent = note.title;
        content.textContent = note.text;

        edit.textContent = "✏️ Edit";
        edit.onclick = () => {
            document.getElementById("noteTitle").value = note.title;
            document.getElementById("noteText").value = note.text;
            editIndex = index;
        };

        del.textContent = "🗑️ Delete";
        del.onclick = () => {
            if (confirm("এই নোটটি মুছে ফেলবে?")) {
                notes.splice(index, 1);
                localStorage.setItem("myNotes", JSON.stringify(notes));
                displayNotes();
            }
        };

        item.append(heading, content, edit, del);
        list.appendChild(item);
    });
}

function showPhotos() {
    document.getElementById("photos").hidden = false;
}

displayNotes();
</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}
</script>

<script>
function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("bn-BD");

    document.getElementById("date").textContent =
        now.toLocaleDateString("bn-BD", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });
}

updateClock();
setInterval(updateClock, 1000);
</script>
     <script src="notes.js"></script>
</body>
</html>
